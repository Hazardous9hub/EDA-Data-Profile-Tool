<svg viewBox="-15 -15 286 304" xmlns="http://www.w3.org/2000/svg" id="numpy-icon">
  <defs>
    <style>
      @keyframes numpy-grid-draw {
        0% {
          stroke-dasharray: 0 1800;
          fill: transparent;
        }
        40% {
          stroke-dasharray: 1800 1800;
          fill: transparent;
        }
        55%, 85% {
          stroke-dasharray: 1800 1800;
          fill: #4DABCF;
        }
        100% {
          stroke-dasharray: 0 1800;
          fill: transparent;
        }
      }

      @keyframes numpy-n-draw {
        0% {
          stroke-dasharray: 0 800;
          fill: transparent;
        }
        40% {
          stroke-dasharray: 800 800;
          fill: transparent;
        }
        55%, 85% {
          stroke-dasharray: 800 800;
          fill: #4D77CF;
        }
        100% {
          stroke-dasharray: 0 800;
          fill: transparent;
        }
      }

      @keyframes numpy-float {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      #numpy-icon {
        overflow: visible;
      }

      .numpy-group {
        animation: numpy-float 4.5s ease-in-out infinite;
        transform-origin: center;
      }

      .numpy-grid {
        stroke: #4DABCF;
        stroke-width: 4px;
        stroke-linejoin: round;
        stroke-linecap: round;
        animation: numpy-grid-draw 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .numpy-n {
        stroke: #4D77CF;
        stroke-width: 4px;
        stroke-linejoin: round;
        stroke-linecap: round;
        animation: numpy-n-draw 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <g class="numpy-group">
    <!-- Isometric Grid Tiles / Facets -->
    <path
      class="numpy-grid"
      d="m191.548 186.292l.06 60.52l-53.705 26.8v-60.494zM256 153.947v60.731l-45.805 22.86l-.033-60.454zm-64.533-48.66l.06 59.885l-53.625 26.647v-59.905zM256 73.205v59.509l-45.851 23.309l-.04-60.005zm-126.262-7.04l47.933 24.195l-49.731 24.975l-47.028-23.62zM63.065 32.511l45.718 23.077l-48.938 25.543l-46.954-23.58zm130.69.35l49.243 24.69l-44.04 22.12l-48.032-24.228zM128.233 0l44.33 22.225l-42.506 22.694l-45.68-23.039z" />

    <!-- The 3D 'N' Letter Form -->
    <path
      class="numpy-n"
      d="M118.944 131.914L82.77 113.728v78.606S38.533 98.207 34.434 89.752c-.528-1.091-2.703-2.288-3.259-2.578C23.243 83.009 0 71.235 0 71.235V210.11l32.154 17.188v-72.59s43.768 84.105 44.211 85.024c.443.92 4.84 9.784 9.533 12.897c6.253 4.139 33.053 20.255 33.053 20.255z" />
  </g>
</svg>
